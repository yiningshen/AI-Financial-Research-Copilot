[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "logfire==5.1.0",
    "openai==3.13.0",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "pydantic-ai==2.43.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.53",
    "structlog==26.1.0",
    "supabase==2.31.0",
    "uvicorn==0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[tool.ruff.lint.isort]
# The local `alembic/` migrations directory makes ruff read the installed
# `alembic` package as first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
markers = [
    "integration: needs live OpenAI / Supabase credentials; excluded from the fast suite",
]

[dependency-groups]
dev = [
    "docling==2.128.0",
    "ipykernel==7.3.0",
    "pytest==9.1.1",
    "ruff==0.16.7",
    "tiktoken==0.12.0",
]

[tool.logfire]
# Tests and one-off scripts import instrumented modules without configuring
# Logfire; their spans are intentionally dropped.
ignore_no_config = true
